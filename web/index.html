  </header>

  <div class="controls" role="toolbar">
    <div class="seg" role="group" aria-label="level">
      <button data-level="canton" data-i18n="level_canton"></button>
      <button data-level="municipality" data-i18n="level_municipality"></button>
      <button data-level="federal" data-i18n="level_federal"></button>
      <button data-level="sector" data-i18n="level_sector"></button>
    </div>
    <label class="metric">
      <span data-i18n="metric"></span>
      <select id="metric"></select>
    </label>
    <div class="orgs" id="orgtoggle">
      <label><input type="checkbox" id="showorgs" checked> <span data-i18n="orgs_layer"></span></label>
      <select id="sectorfilter" aria-label="sector"><option value="" data-i18n="all_sectors"></option></select>
    </div>
    <div class="searchwrap">
      <input id="search" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false" data-i18n-ph="search">
      <ul id="suggest" role="listbox" hidden></ul>
    </div>
  </div>

  <main>
    <section class="mapwrap">
      <div id="map" aria-label="map"></div>
      <div id="matrix" hidden></div>
      <div class="legend" id="legend"></div>
      <div class="tooltip" id="tooltip" role="status" hidden></div>
    </section>
    <aside id="panel" aria-live="polite"></aside>
  </main>

  <footer>
    <span id="datanote"></span>
    <a id="methodlink" href="https://github.com/Accelerate-GmbH/cert_landscape_CH/blob/main/METHOD.md" data-i18n="method"></a>
