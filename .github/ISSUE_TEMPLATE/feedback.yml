name: Feedback
description: Feedback, suggestion or wrong data on the Trust & Sovereignty Posture Radar. After submission the text is moved to the private repository and removed here.
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: Do not enter personal data. The edit history of this issue remains visible.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: ["Wrong data", "Missing data", "Suggestion", "Feedback on the page"]
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source (optional)
  - type: textarea
    id: context
    attributes:
      label: Context (sent along by the page)
      render: text
