name: monthly snapshot

on:
  schedule:
    - cron: "17 3 2 * *"   # 2nd of every month, 03:17 UTC
  workflow_dispatch:
    inputs:
      canton:
        description: "Only this canton (code, e.g. ZG); empty = all"
        required: false
      probe:
        description: "Run the live TLS probe"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      # Python from uv bundles OpenSSL 3.5; Python 3.15 exposes TLS group
      # selection, which the post-quantum key exchange check needs.
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv python install 3.15
          uv venv --python 3.15 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Cache CT, certificate and DNS lookups (lets a cut-off run resume)
        uses: actions/cache@v4
        with:
          path: .cache
          key: tlsmap-${{ github.run_id }}
          restore-keys: tlsmap-
      - run: uv pip install -e .[dev]
      - run: pytest -q
      - name: Run pipeline
        env:
          CERTSPOTTER_API_KEY: ${{ secrets.CERTSPOTTER_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.canton }}" ]; then ARGS="$ARGS --canton ${{ github.event.inputs.canton }}"; fi
          if [ "${{ github.event.inputs.probe }}" != "false" ]; then ARGS="$ARGS --probe"; fi
          tlsmap run $ARGS
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git commit -m "Snapshot $(date -u +%Y-%m-%d)" || { echo "nothing to commit"; exit 0; }
          git pull --rebase
          git push
