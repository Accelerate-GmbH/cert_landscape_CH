name: monthly snapshot

# Full run: one job per canton (canton and its municipalities), one job for
# the critical-services list, one job verifying the list, then a merge job
# that combines the batches, links listed hosts to administrations, writes
# output/ and commits it. The map is published afterwards by "publish map".

on:
  schedule:
    - cron: "17 3 2 * *"   # 2nd of every month, 03:17 UTC
  workflow_dispatch:
    inputs:
      canton:
        description: "Only this canton (code, e.g. ZG; CH = federal administration); empty = all"
        required: false
      list:
        description: "Include the critical-services list"
        type: boolean
        default: true
      probe:
        description: "Run the live TLS checks"
        type: boolean
        default: true
      reuse_run:
        description: "Run IDs (comma-separated, oldest first) whose batches to keep when rerunning single cantons"
        required: false

permissions:
  contents: write
  actions: read

env:
  PROBE: ${{ github.event.inputs.probe == 'false' && '' || '--probe' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv python install 3.15
          uv venv --python 3.15 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - run: uv pip install -e .[dev]
      - run: pytest -q

  cantons:
    needs: test
    if: github.event.inputs.canton != 'CH'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6        # be gentle with crt.sh
      matrix:
        canton: ${{ fromJSON(github.event.inputs.canton != '' && github.event.inputs.canton != null && format('["{0}"]', github.event.inputs.canton) || '["ZH","BE","LU","UR","SZ","OW","NW","GL","ZG","FR","SO","BS","BL","SH","AR","AI","SG","GR","AG","TG","TI","VD","VS","NE","GE","JU"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Python from uv bundles OpenSSL 3.5; Python 3.15 exposes TLS group
      # selection, which the post-quantum key exchange check needs.
      - run: |
          uv python install 3.15
          uv venv --python 3.15 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Restore lookups (lets a cut-off batch resume)
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: tlsmap-${{ matrix.canton }}-${{ github.run_id }}
          restore-keys: tlsmap-${{ matrix.canton }}-
      - run: uv pip install -e .
      - name: Run canton ${{ matrix.canton }}
        timeout-minutes: 310
        env:
          CERTSPOTTER_API_KEY: ${{ secrets.CERTSPOTTER_API_KEY }}
        run: tlsmap run --canton ${{ matrix.canton }} --entities cantons,municipalities $PROBE --raw-out raw/${{ matrix.canton }}.json.gz
      - name: Save lookups, also when the batch failed or was cut off
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: tlsmap-${{ matrix.canton }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.canton }}
          path: raw/
          retention-days: 7

  federal:
    needs: test
    # Departments and federal offices, one batch per department so that each
    # fits the time limit (the federal administration has over 12 000
    # hostnames). Part of every full run and of single reruns with canton=CH.
    if: github.event.inputs.canton == '' || github.event.inputs.canton == null || github.event.inputs.canton == 'CH'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        dept: [BK, EDA, EDI, EJPD, VBS, EFD, WBF, UVEK, JUS]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv python install 3.15
          uv venv --python 3.15 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Restore lookups (lets a cut-off batch resume)
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: tlsmap-federal-${{ matrix.dept }}-${{ github.run_id }}
          restore-keys: |
            tlsmap-federal-${{ matrix.dept }}-
            tlsmap-federal-
      - run: uv pip install -e .
      - name: Rate department ${{ matrix.dept }}
        timeout-minutes: 310
        env:
          CERTSPOTTER_API_KEY: ${{ secrets.CERTSPOTTER_API_KEY }}
        run: tlsmap run --entities federal --only ${{ matrix.dept }} $PROBE --raw-out raw/federal-${{ matrix.dept }}.json.gz
      - name: Save lookups, also when the batch failed or was cut off
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: tlsmap-federal-${{ matrix.dept }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: raw-federal-${{ matrix.dept }}
          path: raw/
          retention-days: 7

  services:
    needs: test
    if: github.event.inputs.list != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv python install 3.15
          uv venv --python 3.15 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Restore lookups (lets a cut-off batch resume)
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: tlsmap-services-${{ github.run_id }}
          restore-keys: tlsmap-services-
      - run: uv pip install -e .
      - name: Rate the critical-services list
        env:
          CERTSPOTTER_API_KEY: ${{ secrets.CERTSPOTTER_API_KEY }}
        timeout-minutes: 320
        run: tlsmap run --entities organisations $PROBE --raw-out raw/services.json.gz
      - name: Save lookups, also when the batch failed or was cut off
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: tlsmap-services-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: raw-services
          path: raw/
          retention-days: 7

  verify-list:
    needs: test
    if: github.event.inputs.list != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: tlsmap verify-list
      - uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            data/critical_services/verification.json
            data/critical_services/verification.md
          retention-days: 7

  merge:
    needs: [test, cantons, federal, services, verify-list]
    # not after a cancelled run: a cut-off merge must not overwrite newer output
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Batches of earlier runs (oldest first; this run's batches win)
        if: github.event.inputs.reuse_run != '' && github.event.inputs.reuse_run != null
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ github.event.inputs.reuse_run }}
        run: |
          mkdir -p raw
          for id in $(echo "$RUNS" | tr ',' ' '); do
            rm -rf prev && mkdir prev
            gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'raw-*' -D prev
            find prev -name '*.json.gz' -exec cp {} raw/ \;
            if [ "${{ github.event.inputs.list }}" = "false" ]; then
              rm -rf prevv && gh run download "$id" -R "$GITHUB_REPOSITORY" -n verification -D prevv 2>/dev/null \
                && cp prevv/verification.* data/critical_services/ || true
            fi
          done
          ls raw
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: raw
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: verification
          path: data/critical_services
      - name: Merge batches
        run: |
          ls raw
          tlsmap merge raw/*.json.gz
      - name: Keep all batches of this snapshot (for single reruns)
        uses: actions/upload-artifact@v4
        with:
          name: raw-all
          path: raw/
          retention-days: 35
      - name: Keep non-public results as a workflow artifact (not committed)
        uses: actions/upload-artifact@v4
        with:
          name: restricted-results
          path: output/*/restricted/
          if-no-files-found: ignore
          retention-days: 90
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output data/critical_services/verification.json data/critical_services/verification.md 2>/dev/null || git add output
          git commit -m "Snapshot $(date -u +%Y-%m-%d)" || { echo "nothing to commit"; exit 0; }
          # output written by this run wins over output committed meanwhile,
          # also where one side deleted a file the other changed
          if ! git pull --rebase -X theirs; then
            for f in $(git diff --name-only --diff-filter=U); do
              if [ -e "$f" ]; then git add "$f"; else git rm -q --cached "$f"; fi
            done
            GIT_EDITOR=true git rebase --continue
          fi
          git push
