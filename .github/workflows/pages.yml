name: publish map

on:
  push:
    branches: [main]
    paths: ["web/**", "output/latest/**"]
  workflow_run:
    workflows: ["monthly snapshot"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir -p site/data
          cp web/*.html web/*.css web/*.js site/
          cp -r web/vendor site/
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" site/index.html
          curl -fsSL -o site/data/ch-combined.json https://unpkg.com/swiss-maps@4.7.0/2026/ch-combined.json
          if [ -f output/latest/map.json ]; then
            cp output/latest/map.json site/data/map.json
            if [ -d output/latest/resources ]; then cp -r output/latest/resources site/data/resources; fi
            if [ -f output/latest/search.json ]; then cp output/latest/search.json site/data/search.json; fi
            if [ -f output/latest/hosts.json ]; then cp output/latest/hosts.json site/data/hosts.json; fi
          else
            cp web/data/map.json site/data/map.json
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # GitHub sometimes cannot find the artifact right after the upload
      # ("Fetching artifact metadata failed"); a second attempt a minute later works.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
