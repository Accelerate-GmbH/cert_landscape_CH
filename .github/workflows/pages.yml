name: publish map

# Code of the site comes from main (web/, app/). The data is read at build
# time from the non-public pipeline repository and goes only into the
# deployed site, never into this repository. The pipeline repository starts
# this workflow with the event data-published after every monthly run.
# Needs a token with read access to the contents of
# Accelerate-swiss/cert_landscape_CH_data, as secret REPO_TOKEN (the same token
# can serve both repositories) or DATA_REPO_TOKEN.
on:
  push:
    branches: [main]
    paths: ["web/**", "app/**", ".github/workflows/pages.yml"]
  repository_dispatch:
    types: [data-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Data from the pipeline repository (read only, not committed)
        uses: actions/checkout@v4
        with:
          repository: Accelerate-swiss/cert_landscape_CH_data
          ref: main
          token: ${{ secrets.REPO_TOKEN || secrets.DATA_REPO_TOKEN }}
          path: src-data
          persist-credentials: false
          sparse-checkout: |
            output/latest/map.json
            output/latest/hosts.json
            output/latest/search.json
            output/latest/resources
            output/public/v2
          sparse-checkout-cone-mode: false
      - name: Only the files the website loads
        run: |
          set -e
          mkdir -p pub/map pub/v2
          cp src-data/output/latest/map.json src-data/output/latest/hosts.json src-data/output/latest/search.json pub/map/
          cp -r src-data/output/latest/resources pub/map/resources
          cp -r src-data/output/public/v2/. pub/v2/
          git -C src-data rev-parse --short HEAD > pub/SOURCE
          rm -rf src-data
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontends consistent with the data
        run: node tools/check_site.mjs pub
      - name: Assemble site
        run: |
          set -e
          mkdir -p site/data site/v2
          # current map
          cp web/*.html web/*.css web/*.js site/
          cp -r web/vendor site/
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" site/index.html
          curl -fsSL -o site/data/ch-combined.json https://unpkg.com/swiss-maps@4.7.0/2026/ch-combined.json
          cp -r pub/map/. site/data/
          # new frontend (draft) under /v2, reading only its public data folder (docs/DATA_CONTRACT.md)
          cp -r app/. site/v2/
          cp -r pub/v2 site/v2/data
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" site/v2/index.html
          echo "data from $(cat pub/SOURCE)"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # GitHub sometimes cannot find the artifact right after the upload
      # ("Fetching artifact metadata failed"); a second attempt a minute later works.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
