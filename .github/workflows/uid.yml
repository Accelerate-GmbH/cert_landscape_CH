name: UID numbers

# UID numbers of cantons, municipalities and federal departments from the
# public search service of the UID register. They change rarely (mergers of
# municipalities, reorganisations), so the lookup runs once a year and on
# demand; the monthly snapshot uses the committed data/uid/entities.json.

on:
  schedule:
    - cron: "41 2 10 1 *"   # 10 January, 02:41 UTC
  workflow_dispatch:
    inputs:
      canton:
        description: "Only this canton (code, e.g. ZG); empty = all"
        required: false
        default: ""
      refresh:
        description: "Look up again, also where a UID is known"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: uid
  cancel-in-progress: false

jobs:
  uid:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Restore earlier answers (lets a cut-off lookup resume)
        uses: actions/cache/restore@v4
        with:
          path: .cache/uid
          key: uid-${{ github.run_id }}
          restore-keys: uid-
      - name: Look up UID numbers
        timeout-minutes: 320
        run: |
          args=""
          [ -n "${{ github.event.inputs.canton }}" ] && args="$args --canton ${{ github.event.inputs.canton }}"
          [ "${{ github.event.inputs.refresh }}" = "true" ] && args="$args --refresh"
          tlsmap uid $args
      - name: Save answers, also when the lookup was cut off
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/uid
          key: uid-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit
        if: always()
        run: |
          [ -f data/uid/entities.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uid/entities.json
          git commit -m "UID numbers $(date -u +%Y-%m-%d)" || { echo "nothing to commit"; exit 0; }
          git pull --rebase -X theirs
          git push
