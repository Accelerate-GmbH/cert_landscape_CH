[probe]
# Canary hosts used to detect TLS interception before probing. If the
# certificate served for a canary is not issued by a CA in the registry, the
# network is intercepting TLS and probe results would be wrong.
canaries = ["letsencrypt.org", "www.swisssign.com", "www.digicert.com"]
timeout_seconds = 8
