[[ca]]
id = "digicert"
name = "DigiCert"
match_ccadb = ["DigiCert"]
match_org = ["DigiCert Inc", "DigiCert, Inc.", "DigiCert Ireland Limited", "DigiCert Ltd", "Thawte, Inc.", "GeoTrust Inc.", "QuoVadis Limited", "QuoVadis Trustlink Schweiz AG"]
country = "US"
validation = "mixed"
cn_rules = [["\\bEV\\b|Extended Validation", "EV"], ["Encryption Everywhere|\\bDV\\b|RapidSSL|Thawte TLS|GeoTrust TLS DV", "DV"], ["\\bOV\\b", "OV"]]
sources = []
notes = "Covers DigiCert Ireland, QuoVadis, Thawte, GeoTrust, RapidSSL and reseller intermediates such as Trust Provider B.V."

