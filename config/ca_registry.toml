controller = "Sectigo, headquartered in Scottsdale (AZ), owned by GI Partners"
control_country = "US"
validation = "mixed"
cn_rules = [["\\bEV\\b|Extended Validation", "EV"], ["Organization Validation|\\bOV\\b", "OV"], ["Domain Validation|\\bDV\\b|ZeroSSL|Domain Secure Site", "DV"]]
sources = ["https://www.sectigo.com/blog/a-new-chapter-for-sectigo-with-gi-partners", "https://mergr.com/transaction/gi-partners-acquires-sectigo"]
notes = "CCADB country is the UK legal entity. Also covers ZeroSSL (HID Global), Trustico, GoGetSSL, Gandi and Network Solutions intermediates, which CCADB attributes to Sectigo."

