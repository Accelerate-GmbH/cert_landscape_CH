# Federal level, one entity per department plus the Federal Chancellery and
# courts/parliament. admin.ch is too large for a single crt.sh query, so it is
# listed per department and federal office (each label is queried as
# %.<label>). Run with: tlsmap run --entities federal
# Offices with their own domains are listed with the department they belong
# to. Names that do not exist simply return nothing.

[[federal]]
id = "BK"
code = "BK"
name = "Bundeskanzlei und übergreifende Dienste"
domains = ["bk.admin.ch", "www.admin.ch", "news.admin.ch", "fedlex.admin.ch", "edoeb.admin.ch", "ch.ch"]

