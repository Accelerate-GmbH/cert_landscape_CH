# What a domain or host depends on, read from DNS and HTTP: mail platform,
# sending services, cloud and hosting, SaaS with verified domains, login
# provider, type of service. Used by src/tlsmap/stack.py.
#
# Each provider: name, country of the company that controls it, kind, and the
# patterns that reveal it. Patterns are suffixes of host names unless noted.
# Countries are those of the controlling company (US for Microsoft, Amazon,
# Google, even when data centres are in Switzerland), as in the rating.

[providers.microsoft365]
name = "Microsoft 365"
country = "US"
kind = "saas"
mx = ["mail.protection.outlook.com"]
spf = ["spf.protection.outlook.com"]
txt = ["MS=", "ms-domain-verification"]
cname = ["outlook.com", "office.com", "sharepoint.com", "lync.com", "msappproxy.net"]

[providers.google]
name = "Google Workspace"
country = "US"
kind = "saas"
mx = ["aspmx.l.google.com", "googlemail.com", "l.google.com"]
spf = ["_spf.google.com"]
txt = ["google-site-verification"]
cname = ["ghs.googlehosted.com", "googlehosted.com"]

[providers.entra]
name = "Microsoft Entra ID"
country = "US"
kind = "idp"
redirect = ["login.microsoftonline.com", "login.microsoft.com", "b2clogin.com", "ciamlogin.com"]
cname = ["msidentity.com", "b2clogin.com"]

[providers.eiam]
